<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Quote Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <h1>Random Quote</h1>

  <figure class="card" id="card" aria-live="polite">
    <span class="mark" aria-hidden="true">&ldquo;</span>
    <div class="content" id="content">
      <blockquote id="quote"></blockquote>
      <figcaption><span class="dash" aria-hidden="true"></span><cite id="author"></cite></figcaption>
    </div>
  </figure>

  <button class="btn" id="newBtn" type="button">New Quote</button>
</main>
<script src="script.js"></script>
</body>
</html>
